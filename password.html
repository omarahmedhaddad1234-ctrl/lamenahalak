<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إعادة تعيين كلمة المرور</title>

    <link rel="icon" href="./images/logo.png" type="image/jpeg" />
    <!-- ====== Firebase SDK (إصدار 10.8.0) ====== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>

    <style>
        /* ---------- reset & base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1120 0%, #1a2639 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }

        /* ---------- card ---------- */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transition: transform 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* ---------- header ---------- */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.18);
            border: 1px solid rgba(99, 102, 241, 0.25);
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .header h1 {
            color: #f1f5f9;
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 0.4rem;
            line-height: 1.6;
        }

        /* ---------- form ---------- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            font-size: 1rem;
            transition: all 0.25s ease;
            outline: none;
            direction: ltr;
        }

        .form-group input::placeholder {
            color: #64748b;
            font-weight: 300;
        }

        .form-group input:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .form-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---------- button ---------- */
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .btn-submit:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.35);
        }

        .btn-submit:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- back link ---------- */
        .back-link {
            text-align: center;
            margin-top: 1.8rem;
        }

        .back-link a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-link a:hover {
            color: #c7d2fe;
        }

        /* ---------- custom alert ---------- */
        .alert-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 999;
            animation: fadeIn 0.25s ease;
        }

        .alert-overlay.active {
            display: flex;
        }

        .alert-box {
            background: #1e293b;
            border-radius: 2rem;
            padding: 2.5rem 2rem 2rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
        }

        .alert-box .alert-icon {
            font-size: 3.2rem;
            margin-bottom: 0.6rem;
        }

        .alert-box h3 {
            color: #f1f5f9;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .alert-box p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .alert-box .btn-close-alert {
            padding: 0.6rem 2.2rem;
            border: none;
            border-radius: 2rem;
            background: #6366f1;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .alert-box .btn-close-alert:hover {
            background: #818cf8;
        }

        /* ---------- animations ---------- */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ---------- responsive ---------- */
        @media (max-width: 500px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 1.8rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .alert-box {
                padding: 2rem 1.2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ====== CARD ====== -->
    <div class="card">
        <div class="header">
            <div class="icon">🔐</div>
            <h1>نسيت كلمة المرور؟</h1>
            <p>أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمتك</p>
        </div>

        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label for="emailInput">البريد الإلكتروني</label>
                <input
                type="email"
                id="emailInput"
                placeholder="example@mail.com"
                autocomplete="email"
                required
                />
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">إرسال رابط إعادة التعيين</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="back-link">
            <a href="#" id="backToLogin">← &nbsp; العودة إلى تسجيل الدخول</a>
        </div>
    </div>

    <!-- ====== CUSTOM ALERT ====== -->
    <div class="alert-overlay" id="alertOverlay">
        <div class="alert-box">
            <div class="alert-icon" id="alertIcon">✅</div>
            <h3 id="alertTitle">تم الإرسال</h3>
            <p id="alertMessage">تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.</p>
            <button class="btn-close-alert" id="alertCloseBtn">حسناً</button>
        </div>
    </div>

    <!-- ====== JAVASCRIPT ====== -->
    <script>
        // ============================================================
        //  1.  Firebase config (بيانات مشروع nemo-8d0c7)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDQ8LFihzOPueW0_FCgRF6uEiAMgn24sF8",
            authDomain: "nemo-8d0c7.firebaseapp.com",
            projectId: "nemo-8d0c7",
            storageBucket: "nemo-8d0c7.firebasestorage.app",
            messagingSenderId: "585101385202",
            appId: "1:585101385202:web:fb703a536893fb4aaadf6b"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ============================================================
        //  2.  DOM refs
        // ============================================================
        const form = document.getElementById('forgotForm');
        const emailInput = document.getElementById('emailInput');
        const submitBtn = document.getElementById('submitBtn');
        const alertOverlay = document.getElementById('alertOverlay');
        const alertIcon = document.getElementById('alertIcon');
        const alertTitle = document.getElementById('alertTitle');
        const alertMessage = document.getElementById('alertMessage');
        const alertCloseBtn = document.getElementById('alertCloseBtn');

        // ============================================================
        //  3.  Custom Alert
        // ============================================================
        function showCustomAlert(type, title, message) {
            // type: 'success' | 'error'
            if (type === 'success') {
                alertIcon.textContent = '✅';
                alertOverlay.style.borderTop = '4px solid #34d399';
            } else {
                alertIcon.textContent = '❌';
                alertOverlay.style.borderTop = '4px solid #f87171';
            }
            alertTitle.textContent = title;
            alertMessage.textContent = message;
            alertOverlay.classList.add('active');
        }

        function closeAlert() {
            alertOverlay.classList.remove('active');
        }

        alertCloseBtn.addEventListener('click', closeAlert);
        alertOverlay.addEventListener('click', (e) => {
            if (e.target === alertOverlay) closeAlert();
        });

        // ============================================================
        //  4.  Forgot Password Logic
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();

            // --- validation ---
            if (!email) {
                showCustomAlert('error', 'تنبيه', 'الرجاء إدخال البريد الإلكتروني.');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showCustomAlert('error', 'خطأ', 'البريد الإلكتروني غير صحيح.');
                return;
            }

            // --- loading state ---
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            try {
                await auth.sendPasswordResetEmail(email);

                showCustomAlert(
                    'success',
                    'تم الإرسال ✅',
                    'تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.'
                );

                emailInput.value = '';

            } catch (error) {
                let msg = 'حدث خطأ غير متوقع. حاول مرة أخرى.';

                if (error.code === 'auth/user-not-found') {
                    msg = 'لا يوجد حساب بهذا البريد الإلكتروني.';
                } else if (error.code === 'auth/invalid-email') {
                    msg = 'البريد الإلكتروني غير صحيح.';
                } else if (error.code === 'auth/too-many-requests') {
                    msg = 'تم إرسال الكثير من الطلبات. انتظر قليلاً ثم حاول مرة أخرى.';
                }

                showCustomAlert('error', 'خطأ', msg);
            }

            // --- remove loading ---
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
        });

        // ============================================================
        //  5.  Back to Login (توجيه حقيقي)
        // ============================================================
        document.getElementById('backToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            // استبدل "index.html" باسم صفحة تسجيل الدخول الخاصة بك
            window.location.href = "index.html";
        });

        // ============================================================
        //  6.  Enter key triggers submit (already handled by form)
        // ============================================================

        console.log('✅ Forgot Password page ready with real Firebase config.');
    </script>

</body>
</html>
